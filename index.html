<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Busca de Técnico Responsável</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --card:#0a0a0a;
    --accent:#6ee7b7;
    --muted:#9aa4b2;
    --glass: rgba(255,255,255,0.03);
  }
  *{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
  body{
    margin:0;
    background:linear-gradient(180deg,#000000 0%, #050505 100%);
    color:#e6eef6;
    min-height:100vh;
    padding:28px;
  }
  .wrap{max-width:1100px;margin:0 auto;}
  header{display:flex;align-items:center;gap:18px;margin-bottom:18px;}
  header h1{margin:0;font-size:20px;font-weight:700;color:var(--accent);}
  
  .search-area{display:flex;gap:12px;align-items:center;margin-bottom:18px;}
  .search-box{
    flex:1;display:flex;align-items:center;background:var(--glass);padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,0.04);
  }
  .search-box input{
    width:100%;background:transparent;border:0;color:#eaf6f0;font-size:16px;outline:none;padding:6px;
  }
  
  .btn{
    background:linear-gradient(90deg,#10b981,#06b6d4);border:none;color:#062024;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer;
  }
  .toggle {
    background:transparent;border:1px solid rgba(255,255,255,0.06);padding:8px 10px;border-radius:10px;color:var(--muted);cursor:pointer;
  }

  main{display:grid;grid-template-columns: 1fr 280px;gap:18px;}
  .results { background: rgba(255,255,255,0.01); padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.03); min-height:400px; }
  .cards{display:grid;grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));gap:10px;}
  
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    padding:16px;border-radius:10px;border:1px solid rgba(255,255,255,0.05);
  }
  .card h3{margin:0 0 8px 0;font-size:16px;color:var(--accent);border-bottom: 1px solid rgba(255,255,255,0.05);padding-bottom: 8px;}
  .meta-item{font-size:14px;margin-bottom:4px;color:#e6eef6;}
  .meta-label{color:var(--muted);font-weight:600;margin-right:4px;text-transform: uppercase;font-size:11px;letter-spacing: 0.5px;}

  .panel{background:var(--card);padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.03);height: fit-content;}
  .stat-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed rgba(255,255,255,0.05);color:var(--muted);font-size:14px;}
  .stat-row span:last-child{color:var(--accent);font-weight:700;}
  
  .table-wrap{overflow:auto;margin-top:10px;}
  table{width:100%;border-collapse:collapse;}
  th,td{padding:10px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.03);font-size:14px}
  th{color:var(--accent);background: rgba(255,255,255,0.02);}
  
  .no-results{padding:24px;text-align:center;color:var(--muted)}

  @media(max-width:900px){ main{grid-template-columns:1fr} .panel{order: -1} }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Busca de Técnico Responsável — Direct Internet</h1>
    </header>

    <div class="search-area">
      <div class="search-box">
        <input id="search" placeholder="Pesquise por região, bairro ou técnico..." autofocus />
      </div>
      <div class="controls" style="display:flex;gap:8px;">
        <button class="toggle" id="viewToggle">Ver: Cards</button>
        <button class="btn" id="clearBtn">Limpar</button>
      </div>
    </div>

    <main>
      <section class="results">
        <div style="margin-bottom:10px;color:var(--muted);font-size:13px">Exibindo <strong id="count">0</strong> resultados</div>
        
        <div id="cardsContainer" class="cards"></div>

        <div id="tableContainer" class="table-wrap" style="display:none;">
          <table>
            <thead><tr><th>Região</th><th>Bairro</th><th>Técnico</th></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>

        <div id="noResults" class="no-results" style="display:none">Nenhum registro encontrado para esta busca.</div>
      </section>

      <aside class="panel">
        <div style="color:var(--accent); font-size:12px; font-weight:700; margin-bottom:10px; text-transform:uppercase;">Resumo da Equipe</div>
        <div class="stat-row"><span>Cidades/Regiões</span><span id="st-reg">—</span></div>
        <div class="stat-row"><span>Bairros Mapeados</span><span id="st-bai">—</span></div>
        <div class="stat-row"><span>Técnicos Totais</span><span id="st-tec">—</span></div>
      </aside>
    </main>
  </div>

let currentView = 'cards';
const searchInput = document.getElementById('search');
const cardsContainer = document.getElementById('cardsContainer');
const tableContainer = document.getElementById('tableContainer');
const tableBody = document.getElementById('tableBody');
const noResults = document.getElementById('noResults');
const countSpan = document.getElementById('count');

function updateStats() {
  const regions = new Set(data.map(i => i.Região));
  const bairros = new Set(data.map(i => i.Bairro).filter(b => b));
  const tecnicos = new Set(data.map(i => i['Técnico-Responsavel']));
  
  document.getElementById('st-reg').textContent = regions.size;
  document.getElementById('st-bai').textContent = bairros.size;
  document.getElementById('st-tec').textContent = tecnicos.size;
}

function render(results) {
  countSpan.textContent = results.length;
  cardsContainer.innerHTML = '';
  tableBody.innerHTML = '';
  
  if (results.length === 0) {
    noResults.style.display = 'block';
    return;
  }
  noResults.style.display = 'none';

  results.forEach(item => {
    const bairroDisplay = item.Bairro || 'Toda a Região';
    
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h3>${item['Técnico-Responsavel']}</h3>
      <div class="meta-item"><span class="meta-label">Região:</span> ${item.Região}</div>
      <div class="meta-item"><span class="meta-label">Bairro:</span> ${bairroDisplay}</div>
    `;
    cardsContainer.appendChild(card);

    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${item.Região}</td>
      <td>${bairroDisplay}</td>
      <td>${item['Técnico-Responsavel']}</td>
    `;
    tableBody.appendChild(row);
  });
}

searchInput.oninput = () => {
  const term = searchInput.value.toLowerCase();
  const filtered = data.filter(i => 
    i.Região.toLowerCase().includes(term) || 
    (i.Bairro && i.Bairro.toLowerCase().includes(term)) ||
    i['Técnico-Responsavel'].toLowerCase().includes(term)
  );
  render(filtered);
};

document.getElementById('viewToggle').onclick = (e) => {
  currentView = currentView === 'cards' ? 'table' : 'cards';
  e.target.textContent = `Ver: ${currentView === 'cards' ? 'Cards' : 'Tabela'}`;
  cardsContainer.style.display = currentView === 'cards' ? 'grid' : 'none';
  tableContainer.style.display = currentView === 'table' ? 'block' : 'none';
};

document.getElementById('clearBtn').onclick = () => {
  searchInput.value = '';
  render(data);
};

updateStats();
render(data);
</script>
